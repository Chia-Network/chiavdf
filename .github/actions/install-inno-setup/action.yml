name: Install Inno Setup
description: Install a pinned Inno Setup 6 release after verifying its SHA-256.

# Inno Setup 6.7.3 is the current 6.x release listed at
# https://jrsoftware.org/isdl.php. The URL below is the official installer link
# from that page, and the SHA-256 is the digest published on the release asset.
# It was also verified locally with curl + sha256sum.
runs:
  using: composite
  steps:
    - name: Install pinned Inno Setup 6.7.3
      shell: pwsh
      env:
        INNO_SETUP_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
        INNO_SETUP_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732
      run: |
        $ErrorActionPreference = 'Stop'
        $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
        Invoke-WebRequest -Uri $env:INNO_SETUP_URL -OutFile $installer
        $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actual -ne $env:INNO_SETUP_SHA256) {
          throw "Inno Setup SHA-256 mismatch: got $actual, expected $($env:INNO_SETUP_SHA256)"
        }
        $process = Start-Process -FilePath $installer `
          -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' `
          -Wait -PassThru
        if ($process.ExitCode -notin @(0, 3010)) {
          throw "Inno Setup installer failed with exit code $($process.ExitCode)"
        }
        $candidates = @(
          (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
          (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
        )
        $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
        if (-not $iscc) {
          throw "Inno Setup ISCC.exe was not found. Checked: $($candidates -join ', ')"
        }
        "INNO_SETUP_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM
