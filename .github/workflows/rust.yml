name: Rust bindings

on:
  push:
    branches:
      - main
  release:
    types: [published]
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow_ref, github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  fuzz_targets:
    name: Run fuzzers (${{ matrix.target }})
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_RELEASE_LTO: false
    strategy:
      fail-fast: false
      matrix:
        target:
          - create_discriminant
          - prove
          - verify
          - verify_n_wesolowski
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
            rust_bindings/fuzz/corpus
          key: ${{ runner.os }}-rust-fuzz-${{ hashFiles('Cargo.lock') }}

      - name: Install cargo-fuzz
        run: |
          if ! command -v cargo-fuzz >/dev/null 2>&1; then
            # cargo-fuzz's lockfile can lag nightly compatibility; fall back to
            # unlocked dependency resolution when --locked fails.
            cargo +nightly install cargo-fuzz --locked || cargo +nightly install cargo-fuzz
          fi

      - name: Cargo fuzz (${{ matrix.target }})
        run: |
          cd rust_bindings
          cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=600

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rustfmt
        run: cargo fmt -- --files-with-diff --check

      - name: Clippy
        run: cargo clippy

  test:
    name: Test (${{ matrix.os.name }} ${{ matrix.arch.name }})
    runs-on: ${{ matrix.os.runs-on[matrix.arch.matrix] }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - name: macOS
            matrix: macos
            runs-on:
              arm: macos-15
              intel: macos-15-intel
            cibw-archs-macos:
              arm: arm64
              intel: x86_64
          - name: Ubuntu
            matrix: ubuntu
            runs-on:
              arm: ubuntu-24.04-arm
              intel: ubuntu-latest
          - name: Windows
            matrix: windows
            runs-on:
              intel: windows-latest

        arch:
          - name: ARM
            matrix: arm
          - name: Intel
            matrix: intel

        exclude:
          - os:
              name: Windows
              matrix: windows
              runs-on:
                intel: windows-latest
            arch:
              name: ARM
              matrix: arm

    steps:
      - uses: actions/checkout@v7

      - name: Setup library path on MacOS
        if: matrix.os.name == 'macOS'
        run: echo "LIBRARY_PATH=$(brew --prefix)/lib:$LIBRARY_PATH" >> $GITHUB_ENV

      - name: Install CMake on MacOS
        if: matrix.os.name == 'macOS'
        run: |
          brew ls --versions cmake >/dev/null 2>&1 || brew install cmake
          CMAKE_BIN="$(brew --prefix cmake)/bin"
          if [ -d "$CMAKE_BIN" ]; then
            echo "$CMAKE_BIN" >> "$GITHUB_PATH"
            export PATH="$CMAKE_BIN:$PATH"
          fi
          if ! command -v cmake >/dev/null 2>&1; then
            BREW_BIN="$(brew --prefix)/bin"
            echo "$BREW_BIN" >> "$GITHUB_PATH"
            export PATH="$BREW_BIN:$PATH"
          fi
          command -v cmake
          cmake --version

      - name: Install LLVM 22 and Ninja on Windows
        if: matrix.os.name == 'Windows'
        shell: pwsh
        run: |
          ./scripts/setup-windows-clang.ps1

      - name: Set up Windows SDK and CRT for clang-cl
        if: matrix.os.name == 'Windows'
        uses: step-security/msvc-dev-cmd@v1.13.1
        with:
          arch: x64
          # Keep the SDK and CRT toolset consistent with the client build.
          toolset: '14.44'

      - name: Cache MinGW GMP on Windows
        if: matrix.os.name == 'Windows'
        id: gmp-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/chiavdf-gmp
          key: ${{ runner.os }}-${{ runner.arch }}-mingw-gmp-${{ hashFiles('scripts/build-windows-mingw-gmp.sh', 'scripts/gmp-6.3.0-fat-isa.patch') }}

      - name: Set up MSYS2 on Windows
        if: matrix.os.name == 'Windows' && steps.gmp-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          update: true
          install: >-
            msys/m4
            msys/lzip
            msys/patch
            base-devel
            mingw-w64-x86_64-toolchain

      - name: Build MinGW GMP on Windows
        if: matrix.os.name == 'Windows' && steps.gmp-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build-windows-mingw-gmp.sh "$RUNNER_TEMP/chiavdf-gmp"

      - name: Configure MinGW GMP on Windows
        if: matrix.os.name == 'Windows'
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'chiavdf-gmp'
          "CHIAVDF_GMP_PREFIX=$prefix" >> $env:GITHUB_ENV
          "MINGW_LIBMINGWEX=$prefix/lib/libmingwex.a" >> $env:GITHUB_ENV
          "MINGW_LIBGCC=$prefix/lib/libgcc.a" >> $env:GITHUB_ENV

      - name: Install libclang-dev on Linux
        if: matrix.os.name == 'Ubuntu'
        run: |
          # Avoid transient 404s from stale apt indices / mirror lag.
          sudo apt-get update -y -o Acquire::Retries=3
          sudo apt-get install libclang-dev -y

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Pin the MSVC linker on Windows
        if: matrix.os.name == 'Windows'
        shell: pwsh
        run: |
          # Git Bash prepends its Unix tools to PATH, including a different
          # link.exe. Use the linker from the selected MSVC toolset explicitly.
          $linker = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
          if (-not (Test-Path -LiteralPath $linker)) {
            throw "MSVC linker not found: $linker"
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Tests and proof regressions
        run: cargo test --workspace && cargo test --workspace --release

      - name: Benchmark Rust vdf_bench discr/prove (Linux)
        if: matrix.os.matrix == 'ubuntu' && matrix.arch.matrix == 'intel'
        shell: bash
        run: |
          echo "Benchmarking Rust bindings discr 50"
          cargo run --quiet --release -p chiavdf-tools --bin vdf_bench -- discr 50
          echo "Benchmarking Rust bindings prove 100000"
          cargo run --quiet --release -p chiavdf-tools --bin vdf_bench -- prove 100000

      - name: Set up Python for the Windows benchmark comparison
        if: matrix.os.name == 'Windows'
        uses: Chia-Network/actions/setup-python@main
        with:
          python-version: '3.12'

      - name: Test benchmark scheduling and reporting
        if: matrix.os.name == 'Windows'
        run: python tests/test_compare_vdf_bench.py

      - name: Cache MPIR for C++ and Python benchmarks
        if: matrix.os.name == 'Windows'
        id: benchmark-mpir-cache
        uses: actions/cache@v6.1.0
        with:
          path: mpir_gc_x64
          key: windows-mpir-gc-x64-${{ hashFiles('scripts/mpir_gc_x64.commit') }}

      - name: Check out pinned MPIR for C++ and Python benchmarks
        if: matrix.os.name == 'Windows' && steps.benchmark-mpir-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/get-mpir-gc-x64.sh

      - name: Build Windows C++, Rust and Python benchmarks
        if: matrix.os.name == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install 'pybind11==3.1.0'
          if ($LASTEXITCODE -ne 0) { throw 'Installing pybind11 failed' }
          "$PWD/mpir_gc_x64" >> $env:GITHUB_PATH
          $env:PATH = "$PWD/mpir_gc_x64;$env:PATH"
          $cmakeArgs = @(
            '-S', 'src', '-B', 'build-benchmark', '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release',
            '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL',
            '-DCMAKE_C_COMPILER=clang-cl', '-DCMAKE_CXX_COMPILER=clang-cl',
            '-DCMAKE_ASM_COMPILER=clang-cl',
            "-DPython_EXECUTABLE=$((Get-Command python).Source)",
            "-DCMAKE_LIBRARY_OUTPUT_DIRECTORY=$PWD/chiavdf",
            '-DCHIAVDF_GMP_PREFIX=',
            '-DBUILD_PYTHON=ON', '-DBUILD_VDF_BENCH=ON',
            '-DBUILD_VDF_CLIENT=OFF', '-DBUILD_VDF_TESTS=OFF',
            '-DBUILD_CHIAVDFC=OFF', '-DBUILD_HW_TOOLS=OFF'
          )
          cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { throw 'Configuring C++/Python benchmarks failed' }
          cmake --build build-benchmark --config Release --target vdf_bench _chiavdf --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Building C++/Python benchmarks failed' }
          # Python's extension loader searches beside the .pyd for dependent DLLs.
          Get-ChildItem mpir_gc_x64 -Filter '*.dll' | Copy-Item -Destination chiavdf
          python -c "import chiavdf._chiavdf as m; print('Python extension:', m.__file__)"
          if ($LASTEXITCODE -ne 0) { throw 'Loading Python benchmark extension failed' }
          cargo build --locked --release -p chiavdf-tools --bin vdf_bench
          if ($LASTEXITCODE -ne 0) { throw 'Building Rust benchmark failed' }

      - name: Compare Windows benchmarks (six interleaved rounds)
        if: matrix.os.name == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = "$PWD;$env:PYTHONPATH"
          $results = Join-Path $env:RUNNER_TEMP 'windows-vdf-benchmarks'
          New-Item -ItemType Directory -Force $results | Out-Null
          $cpu = (Get-CimInstance Win32_Processor | Select-Object -ExpandProperty Name) -join ', '
          $leaf1 = [System.Runtime.Intrinsics.X86.X86Base]::CpuId(1, 0)
          $leaf7 = [System.Runtime.Intrinsics.X86.X86Base]::CpuId(7, 0)
          $metadata = [ordered]@{
            CPU = $cpu
            'CPUID(1).ECX' = ('0x{0:X8}' -f $leaf1.Item3)
            'CPUID(7,0).EBX' = ('0x{0:X8}' -f $leaf7.Item2)
            Runner = "$env:RUNNER_NAME ($env:RUNNER_OS/$env:RUNNER_ARCH)"
            Commit = (git rev-parse HEAD)
            LLVM = ((clang-cl --version | Select-Object -First 1) -join '')
            Rust = (rustc --version)
            Python = (python --version)
            'MPIR revision' = (Get-Content scripts/mpir_gc_x64.commit).Trim()
            'GMP patch SHA256' = (Get-FileHash scripts/gmp-6.3.0-fat-isa.patch -Algorithm SHA256).Hash
          }
          $metadata | ConvertTo-Json | Set-Content "$results/metadata.json" -Encoding utf8
          python tools/compare_vdf_bench.py `
            --cpp build-benchmark/vdf_bench.exe `
            --rust target/release/vdf_bench.exe `
            --rounds 6 --discriminants 500 --iterations 100000 `
            --metadata "$results/metadata.json" --output-dir "$results"
          if ($LASTEXITCODE -ne 0) { throw 'Benchmark comparison failed' }

      - name: Publish Windows benchmark summary
        if: always() && matrix.os.name == 'Windows'
        shell: pwsh
        run: |
          $summary = Join-Path $env:RUNNER_TEMP 'windows-vdf-benchmarks/summary.md'
          if (Test-Path $summary) {
            Get-Content $summary -Raw -Encoding utf8 >> $env:GITHUB_STEP_SUMMARY
          } else {
            '## Windows VDF benchmark comparison' >> $env:GITHUB_STEP_SUMMARY
            'The comparison did not run. Check the failed build/test steps.' >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload Windows benchmark results
        if: always() && matrix.os.name == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-vdf-benchmarks
          path: ${{ runner.temp }}/windows-vdf-benchmarks
          if-no-files-found: ignore

      - name: Upload bundled Windows GMP
        if: matrix.os.name == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: rust-crate-windows-gmp
          path: ${{ runner.temp }}/chiavdf-gmp
          if-no-files-found: error

  build_crate:
    name: Build crate
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust crate
        run: cargo build --release -p chiavdf

      - name: Build Rust tools
        run: cargo build --release -p chiavdf-tools --bins

      - name: Prepare for publish
        run: |
          cp -r src rust_bindings/cpp

      - name: Download bundled Windows GMP
        uses: actions/download-artifact@v8
        with:
          name: rust-crate-windows-gmp
          path: rust_bindings/gmp-win64

      - name: Publish to crates.io (dry run)
        # We use `--allow-dirty` because the `cpp` folder is copied into the working directory.
        # This is necessary because the `cpp` folder is not part of the crate otherwise.
        run: cargo publish --dry-run -p chiavdf --allow-dirty

      - name: Upload crate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: crate
          path: ./target/package/*-*.crate

      - name: Set Env
        uses: Chia-Network/actions/setjobenv@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: rust-lang/crates-io-auth-action@v1.0.6
        if: env.RELEASE == 'true'
        id: auth

      - name: Publish to crates.io
        if: env.RELEASE == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # See comment above for why `--allow-dirty` is used.
        run: |
          cp -r src rust_bindings/cpp
          cargo publish -p chiavdf --allow-dirty
