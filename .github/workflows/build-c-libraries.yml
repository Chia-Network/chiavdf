name: Build C Libraries

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - '**'
  # Release publishing lives in build-packages.yml, which calls this workflow
  # and attaches the archives only after every matrix has succeeded.
  workflow_call:

concurrency:
  # Literal name, not github.workflow: this file is both an entry point and a
  # callee, and github.workflow is the caller. The same group would cancel
  # or deadlock the release run.
  group: build-c-libraries-${{ github.ref }}-${{ github.event_name }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/long_lived/')) && github.sha || '' }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  build-c-libraries:
    name: C Libraries - ${{ matrix.os.name }} ${{ matrix.arch.name }}
    runs-on: ${{ matrix.os.runs-on[matrix.arch.matrix] }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: macOS
            matrix: macos
            runs-on:
              arm: macos-15
              intel: macos-15-intel
          - name: Ubuntu
            matrix: ubuntu
            runs-on:
              arm: ubuntu-24.04-arm
              intel: ubuntu-latest
          - name: Windows
            matrix: windows
            runs-on:
              intel: windows-latest
        arch:
          - name: ARM
            matrix: arm
          - name: Intel
            matrix: intel
        exclude:
          # Only partial entries are required here by GitHub Actions so generally I
          # only specify the `matrix:` entry.  The super linter complains so for now
          # all entries are included to avoid that.  Reported at
          # https://github.com/github/super-linter/issues/3016
          - os:
              name: Windows
              matrix: windows
              runs-on:
                intel: windows-latest
            arch:
              name: ARM
              matrix: arm

    steps:
    - name: Clean workspace
      uses: Chia-Network/actions/clean-workspace@main

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Checkout mpir for windows
      if: matrix.os.matrix == 'windows'
      shell: bash
      run: bash scripts/get-mpir-gc-x64.sh

    - name: Build
      working-directory: src
      env:
        BUILD_VDF_CLIENT: "N"
      run: |
        cmake . -DBUILD_CHIAVDFC=ON -DBUILD_PYTHON=OFF
        cmake --build .

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: c-libraries-${{ matrix.os.matrix }}-${{ matrix.arch.matrix }}
        path: ./src/lib

    - name: Assemble directory of headers and libraries for distribution
      shell: bash
      run: |
        DIST_DIR="chiavdfc-${{ matrix.os.matrix }}-${{ matrix.arch.matrix }}"
        echo "DIST_DIR=$DIST_DIR" >> "$GITHUB_ENV"
        mkdir -p ${DIST_DIR}/static ${DIST_DIR}/shared

        cp src/c_bindings/c_wrapper.h ${DIST_DIR}/
        find src/lib/static -type f -exec cp {} ${DIST_DIR}/static/ \;
        find src/lib/shared -type f -exec cp {} ${DIST_DIR}/shared/ \;

    - name: Zip (linux/mac)
      if: runner.os != 'Windows'
      run: |
        zip -r chiavdfc-${{ matrix.os.matrix }}-${{ matrix.arch.matrix }}.zip ${{ env.DIST_DIR }}

    - name: Zip (windows)
      if: runner.os == 'Windows'
      run: |
        Compress-Archive -Path ${{ env.DIST_DIR }}/* -Destination chiavdfc-${{ matrix.os.matrix }}-${{ matrix.arch.matrix }}.zip

    - name: Upload zip as artifact
      uses: actions/upload-artifact@v7
      with:
        name: chiavdfc-${{ matrix.os.matrix }}-${{ matrix.arch.matrix }}
        path: |
          ${{ github.workspace }}/chiavdfc-${{ matrix.os.matrix }}-${{ matrix.arch.matrix }}.zip
