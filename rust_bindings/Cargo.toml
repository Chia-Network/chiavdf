[package]
name = "chiavdf"
version = "1.2.3"
edition = "2021"
license = "Apache-2.0"
description = "Bindings to the chiavdf C++ library."
authors = ["Brandon Haggstrom <b.haggstrom@chia.net>"]
homepage = "https://github.com/Chia-Network/chiavdf"
repository = "https://github.com/Chia-Network/chiavdf"
include = ["build.rs", "wrapper.h", "src/**", "cpp/**", "gmp-win64/**", "Cargo.toml"]

[dependencies]
link-cplusplus = "1.0.12"

[build-dependencies]
bindgen = { version = "0.73.2", default-features = false, features = ["runtime"] }
cmake = "0.1.58"

[dev-dependencies]
hex = "0.4.3"
hex-literal = "1.1.0"
