name: Windows benchmark investigation

on:
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  benchmarks:
    name: Windows GMP/MPIR benchmarks
    uses: ./.github/workflows/build-client.yml
    with:
      configs: '["optimized=1"]'
      is_final: 'false'
      notarize_macos: 'false'
      benchmark_only: true
    secrets: inherit

  python-wheel-benchmark:
    name: Windows Python wheel benchmark
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pipx
        run: python -m pip install pipx

      - name: Build and test Windows wheel
        env:
          PIPX_HOME: 'C:\pipx'
          PIPX_BIN_DIR: 'C:\pipx\bin'
          PYTHONWARNINGS: "ignore:Config variable 'Py_DEBUG' is unset:RuntimeWarning"
          CIBW_BUILD: 'cp312-*'
          CIBW_ENABLE: cpython-prerelease
        run: pipx run --spec=cibuildwheel==3.4.1 cibuildwheel --output-dir dist
