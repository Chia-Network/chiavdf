name: GMP Windows perf investigation

# Experiment: why is chiavdf on Windows (MinGW GMP) slower than on Linux?
#
# Each OS runs in ONE job so every variant is measured on the same machine
# (GitHub hands out different EPYC models per job). Per job:
#   GMP 6.3.0 builds: generic (no fat), fat (production), native (exact CPU)
#   x allocator: system malloc vs mimalloc (via mp_set_memory_functions)
#   - scripts/gmp-perf/gmp_microbench.cpp: mpz ops at chiavdf operand sizes
#   - Rust vdf_bench (discr + prove), 3 runs each, best kept
# Windows additionally builds chiavdf with clang-cl (native __int128) against
# the fat GMP, to measure the uint128_t fallback that MSVC builds use, and
# compares against MPIR (what main ships): Rust vdf_bench (MSVC) and the C++
# vdf_bench built like build-client.yml (clang-cl + GNU asm), MPIR vs GMP.
# Cross-OS numbers only compare cleanly when the "Machines" CPUs match.

on:
  push:
    branches:
      - gmp-windows-perf
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GMP_VARIANTS: generic fat fat-isa native
  # Prints which routines GMP's fat dispatcher picked (fat-isa builds only).
  CHIAVDF_GMP_FAT_DEBUG: "1"
  BENCH_RUNS: 3

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      RESULTS: ${{ github.workspace }}\results\windows.txt
    steps:
      - uses: actions/checkout@v7

      - name: CPU info
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force results | Out-Null
          $cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1)
          "CPU: $($cpu.Name.Trim()) ($($env:NUMBER_OF_PROCESSORS) vCPU)" | Tee-Object -FilePath $env:RESULTS

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # m4 is required by GMP's configure and is not part of base-devel.
          install: base-devel m4 make patch mingw-w64-x86_64-toolchain

      - name: Build GMP variants
        shell: msys2 {0}
        run: |
          results=$(cygpath -u "$RESULTS")
          tmp=$(cygpath -u "$RUNNER_TEMP")
          for v in $GMP_VARIANTS; do
            case $v in
              generic) export GMP_HOST_CPU=x86_64 GMP_FAT=0 GMP_FAT_ISA=0 ;;
              fat)     export GMP_HOST_CPU=x86_64 GMP_FAT=1 GMP_FAT_ISA=0 ;;
              fat-isa) export GMP_HOST_CPU=x86_64 GMP_FAT=1 GMP_FAT_ISA=1 ;;
              native)  export GMP_HOST_CPU=native GMP_FAT=0 GMP_FAT_ISA=0 ;;
            esac
            echo "::group::GMP $v"
            skip_check=1; [ "$v" = fat-isa ] && skip_check=0
            GMP_SKIP_CHECK=$skip_check GMP_BUILD_ROOT="$tmp/gmp-build-$v" \
              bash scripts/build-windows-mingw-gmp.sh "$tmp/gmp-$v" 2>&1 | tee "gmp-build-$v.log"
            echo "::endgroup::"
            { echo "--- GMP $v"; grep -E '^(GMP config.guess|Configuring GMP|GMP CFLAGS|Applying)' "gmp-build-$v.log"; } >> "$results"
          done

      - name: GMP microbench
        shell: msys2 {0}
        run: |
          tmp=$(cygpath -u "$RUNNER_TEMP")
          for v in $GMP_VARIANTS; do
            bash scripts/gmp-perf/run-gmp-bench.sh "$tmp/gmp-$v" "windows/$v" "$(cygpath -u "$RESULTS")"
          done

      - uses: dtolnay/rust-toolchain@stable

      - name: vdf_bench (MSVC-compiled chiavdf, uint128_t fallback)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($v in $env:GMP_VARIANTS -split ' ') {
            $prefix = Join-Path $env:RUNNER_TEMP "gmp-$v"
            $env:CHIAVDF_GMP_PREFIX = $prefix
            $env:MINGW_LIBMINGWEX = Join-Path $prefix 'lib\libmingwex.a'
            $env:MINGW_LIBGCC = Join-Path $prefix 'lib\libgcc.a'
            # Separate target dirs: CMake caches the GMP location per build dir.
            $env:CARGO_TARGET_DIR = "target-msvc-$v"
            Write-Host "::group::cargo build (MSVC, GMP $v)"
            cargo build --release -p chiavdf-tools --bin vdf_bench
            if ($LASTEXITCODE -ne 0) { throw "cargo build (GMP $v) failed" }
            Write-Host "::endgroup::"
            foreach ($alloc in 'system', 'mimalloc') {
              $env:CHIAVDF_BENCH_GMP_ALLOC = $alloc
              $env:BENCH_LABEL = "windows/$v/$alloc/msvc"
              "=== vdf_bench $env:BENCH_LABEL ===" | Tee-Object -Append -FilePath $env:RESULTS
              for ($i = 0; $i -lt [int]$env:BENCH_RUNS; $i++) {
                foreach ($run in @(@('discr', '50'), @('prove', '300000'))) {
                  & "target-msvc-$v\release\vdf_bench.exe" @run 2>&1 | Tee-Object -Append -FilePath $env:RESULTS
                  if ($LASTEXITCODE -ne 0) { throw "vdf_bench $run failed ($env:BENCH_LABEL)" }
                }
              }
            }
          }

      # MPIR: the bignum library main's Windows builds use (scripts/mpir_gc_x64.commit).
      - name: Fetch MPIR
        shell: bash
        run: bash scripts/get-mpir-gc-x64.sh

      - name: vdf_bench (MSVC-compiled chiavdf, MPIR)
        shell: pwsh
        env:
          CHIAVDF_USE_MPIR: "1"
          CARGO_TARGET_DIR: target-msvc-mpir
        run: |
          $env:PATH = "$PWD\mpir_gc_x64;$env:PATH"
          Write-Host "::group::cargo build (MSVC, MPIR)"
          cargo build --release -p chiavdf-tools --bin vdf_bench
          if ($LASTEXITCODE -ne 0) { throw "cargo build (MPIR) failed" }
          Write-Host "::endgroup::"
          foreach ($alloc in 'system', 'mimalloc') {
            $env:CHIAVDF_BENCH_GMP_ALLOC = $alloc
            $env:BENCH_LABEL = "windows/mpir/$alloc/msvc"
            "=== vdf_bench $env:BENCH_LABEL ===" | Tee-Object -Append -FilePath $env:RESULTS
            for ($i = 0; $i -lt [int]$env:BENCH_RUNS; $i++) {
              foreach ($run in @(@('discr', '50'), @('prove', '300000'))) {
                & target-msvc-mpir\release\vdf_bench.exe @run 2>&1 | Tee-Object -Append -FilePath $env:RESULTS
                if ($LASTEXITCODE -ne 0) { throw "vdf_bench $run failed ($env:BENCH_LABEL)" }
              }
            }
          }

      # Same chiavdf code built with clang-cl, which has native unsigned __int128
      # (CMake then sets CHIAVDF_USE_UINT128_T_FALLBACK=0).
      - uses: ilammy/msvc-dev-cmd@v1

      # The C++ vdf_bench built the way build-client.yml builds the shipped
      # Windows client: clang-cl + Ninja + GNU asm pipeline. Once with MPIR
      # (what ships today) and once with MinGW GMP (generic), same machine.
      - name: C++ vdf_bench (clang-cl, as build-client.yml), MPIR vs MinGW GMP
        continue-on-error: true
        shell: pwsh
        run: |
          # cmake and vdf_bench write to stderr; don't let that abort the step.
          $ErrorActionPreference = 'Continue'
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja --yes --no-progress }
          if (Test-Path 'C:\Program Files\LLVM\bin') { $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH" }
          $env:PATH = "$PWD\mpir_gc_x64;$env:PATH"
          $gmp = Join-Path $env:RUNNER_TEMP 'gmp-generic'
          $builds = @(
            @{ name = 'mpir'; dir = 'build-cpp-mpir'; extra = @() },
            @{ name = 'generic'; dir = 'build-cpp-gmp'; extra = @(
                "-DCHIAVDF_GMP_PREFIX=$gmp",
                # MinGW libgmp.a needs the MinGW runtime helpers at link time.
                "-DCMAKE_EXE_LINKER_FLAGS=$gmp\lib\libmingwex.a $gmp\lib\libgcc.a") }
          )
          $failed = $false
          foreach ($b in $builds) {
            Write-Host "::group::cmake C++ vdf_bench ($($b.name))"
            $cmakeArgs = @(
              '-S', 'src', '-B', $b.dir, '-G', 'Ninja',
              '-DCMAKE_BUILD_TYPE=Release', '-DCMAKE_TRY_COMPILE_CONFIGURATION=Release',
              '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL',
              '-DCMAKE_C_COMPILER=clang-cl', '-DCMAKE_CXX_COMPILER=clang-cl', '-DCMAKE_ASM_COMPILER=clang-cl',
              '-DBUILD_PYTHON=OFF', '-DBUILD_CHIAVDFC=OFF', '-DBUILD_VDF_CLIENT=OFF',
              '-DBUILD_VDF_BENCH=ON', '-DBUILD_VDF_TESTS=OFF', '-DBUILD_HW_TOOLS=OFF',
              '-DENABLE_GNU_ASM=ON'
            ) + $b.extra
            $log = Join-Path $env:RUNNER_TEMP "cpp-$($b.name)-build.log"
            & cmake @cmakeArgs *> $log
            if ($LASTEXITCODE -eq 0) { & cmake --build $b.dir --target vdf_bench *>> $log }
            $code = $LASTEXITCODE
            Get-Content $log -Tail 15
            Write-Host "::endgroup::"
            Select-String -Path $log -Pattern 'Windows 128-bit integers|GMP library found|MPIR library found' |
              ForEach-Object { "[$($b.name)] $($_.Line.Trim())" } | Tee-Object -Append -FilePath $env:RESULTS
            if ($code -ne 0) {
              "=== C++ vdf_bench ($($b.name)) build FAILED; last 60 lines ===" | Tee-Object -Append -FilePath $env:RESULTS
              Get-Content $log -Tail 60 | Tee-Object -Append -FilePath $env:RESULTS
              $failed = $true
              continue
            }
            $exe = Get-ChildItem $b.dir -Recurse -Filter vdf_bench.exe | Select-Object -First 1
            $label = "windows/$($b.name)/system/clang-cl-cpp"
            "=== C++ vdf_bench $label ===" | Tee-Object -Append -FilePath $env:RESULTS
            for ($i = 0; $i -lt [int]$env:BENCH_RUNS; $i++) {
              foreach ($run in @(@('discr', 50, 'vdf discr (ms)'), @('prove', 300000, 'vdf prove (K ips)'),
                                 @('square_asm', 2000000, 'vdf square_asm (K ips)'))) {
                $out = & $exe.FullName $run[0] $run[1] 2>&1 | Out-String
                if ($LASTEXITCODE -ne 0) { "vdf_bench $($run[0]) failed: $out" | Tee-Object -Append -FilePath $env:RESULTS; $failed = $true; continue }
                $first = ($out -split "`n")[0].Trim()
                $first | Tee-Object -Append -FilePath $env:RESULTS
                if ($first -eq 'Fail') {
                  # repeated_square_fast rejected its own result: a correctness failure.
                  "RESULT|$label|vdf $($run[0]) FAILED runs|1" | Tee-Object -Append -FilePath $env:RESULTS
                }
                if ($first -match 'Time: (\d+) ms') {
                  $ms = [double]$Matches[1]
                  $value = if ($run[0] -eq 'discr') { $ms / $run[1] } else { $run[1] / $ms }
                  "RESULT|$label|$($run[2])|$('{0:F2}' -f $value)" | Tee-Object -Append -FilePath $env:RESULTS
                }
              }
            }
          }
          if ($failed) { exit 1 }

      - name: vdf_bench (clang-cl-compiled chiavdf, native __int128)
        continue-on-error: true
        shell: pwsh
        env:
          CMAKE_GENERATOR: Ninja
          CC: clang-cl
          CXX: clang-cl
          CARGO_TARGET_DIR: target-clangcl
          # chiavdfc never uses the GNU asm pipeline; skip its configure checks.
          CHIAVDF_CMAKE_DEFINES: ENABLE_GNU_ASM=OFF
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'C:\Program Files\LLVM\bin') { $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH" }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja --yes --no-progress }
          "clang-cl: $((Get-Command clang-cl).Source)" | Tee-Object -Append -FilePath $env:RESULTS
          & clang-cl --version | Tee-Object -Append -FilePath $env:RESULTS
          $builtins = Join-Path (& clang-cl --print-resource-dir).Trim() 'lib\windows\clang_rt.builtins-x86_64.lib'
          if (Test-Path $builtins) { $env:CHIAVDF_EXTRA_LINK_LIB = $builtins }
          "clang_rt builtins: $builtins (exists: $(Test-Path $builtins))" | Tee-Object -Append -FilePath $env:RESULTS

          $prefix = Join-Path $env:RUNNER_TEMP 'gmp-fat'
          $env:CHIAVDF_GMP_PREFIX = $prefix
          $env:MINGW_LIBMINGWEX = Join-Path $prefix 'lib\libmingwex.a'
          $env:MINGW_LIBGCC = Join-Path $prefix 'lib\libgcc.a'
          $log = Join-Path $env:RUNNER_TEMP 'clangcl-build.log'
          # Native-command stderr must not become a terminating error here.
          $ErrorActionPreference = 'Continue'
          cargo build --release -vv -p chiavdf-tools --bin vdf_bench *> $log
          $code = $LASTEXITCODE
          Select-String -Path $log -Pattern 'Windows 128-bit integers' | Select-Object -First 1 |
            ForEach-Object { $_.Line } | Tee-Object -Append -FilePath $env:RESULTS
          if ($code -ne 0) {
            "=== clang-cl build FAILED (exit $code); last 80 lines of cargo -vv output ===" |
              Tee-Object -Append -FilePath $env:RESULTS
            Get-Content $log -Tail 80 | Tee-Object -Append -FilePath $env:RESULTS
            "=== error lines ===" | Tee-Object -Append -FilePath $env:RESULTS
            Select-String -Path $log -Pattern 'error|unresolved|FATAL' | Select-Object -First 40 |
              ForEach-Object { $_.Line } | Tee-Object -Append -FilePath $env:RESULTS
            exit 1
          }
          $ErrorActionPreference = 'Stop'
          foreach ($alloc in 'system', 'mimalloc') {
            $env:CHIAVDF_BENCH_GMP_ALLOC = $alloc
            $env:BENCH_LABEL = "windows/fat/$alloc/clang-cl"
            "=== vdf_bench $env:BENCH_LABEL ===" | Tee-Object -Append -FilePath $env:RESULTS
            for ($i = 0; $i -lt [int]$env:BENCH_RUNS; $i++) {
              foreach ($run in @(@('discr', '50'), @('prove', '300000'))) {
                & target-clangcl\release\vdf_bench.exe @run 2>&1 | Tee-Object -Append -FilePath $env:RESULTS
                if ($LASTEXITCODE -ne 0) { throw "vdf_bench $run failed ($env:BENCH_LABEL)" }
              }
            }
          }

      - name: Upload clang-cl build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gmp-perf-clangcl-build-log
          path: ${{ runner.temp }}/clangcl-build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gmp-perf-windows
          path: results/windows.txt
          if-no-files-found: warn

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RESULTS: ${{ github.workspace }}/results/linux.txt
    steps:
      - uses: actions/checkout@v7

      - name: Install build deps
        run: |
          sudo apt-get update -y -o Acquire::Retries=3
          sudo apt-get install -y m4 libclang-dev
          mkdir -p results
          echo "CPU: $(lscpu | sed -n 's/^Model name: *//p') ($(nproc) vCPU)" | tee "$RESULTS"

      - name: Build GMP variants
        run: |
          for v in $GMP_VARIANTS; do
            case $v in
              generic) export GMP_HOST_CPU=x86_64 GMP_FAT=0 GMP_FAT_ISA=0 ;;
              fat)     export GMP_HOST_CPU=x86_64 GMP_FAT=1 GMP_FAT_ISA=0 ;;
              fat-isa) export GMP_HOST_CPU=x86_64 GMP_FAT=1 GMP_FAT_ISA=1 ;;
              native)  export GMP_HOST_CPU=native GMP_FAT=0 GMP_FAT_ISA=0 ;;
            esac
            echo "::group::GMP $v"
            skip_check=1; [ "$v" = fat-isa ] && skip_check=0
            GMP_SKIP_CHECK=$skip_check GMP_BUILD_ROOT="$RUNNER_TEMP/gmp-build-$v" \
              bash scripts/build-windows-mingw-gmp.sh "$RUNNER_TEMP/gmp-$v" 2>&1 | tee "gmp-build-$v.log"
            echo "::endgroup::"
            { echo "--- GMP $v"; grep -E '^(GMP config.guess|Configuring GMP|GMP CFLAGS|Applying)' "gmp-build-$v.log"; } >> "$RESULTS"
          done

      - name: GMP microbench
        run: |
          for v in $GMP_VARIANTS; do
            bash scripts/gmp-perf/run-gmp-bench.sh "$RUNNER_TEMP/gmp-$v" "linux/$v" "$RESULTS"
          done

      - uses: dtolnay/rust-toolchain@stable

      - name: vdf_bench (GCC-compiled chiavdf, native __int128)
        run: |
          for v in $GMP_VARIANTS; do
            prefix="$RUNNER_TEMP/gmp-$v"
            export CARGO_TARGET_DIR="target-$v"
            echo "::group::cargo build (GMP $v)"
            # FindGMP/FindGMPXX search CMAKE_PREFIX_PATH first; only static
            # archives are installed, so -lgmp resolves to this build.
            CMAKE_PREFIX_PATH="$prefix" RUSTFLAGS="-L native=$prefix/lib" \
              cargo build --release -p chiavdf-tools --bin vdf_bench
            echo "::endgroup::"
            for alloc in system mimalloc; do
              export CHIAVDF_BENCH_GMP_ALLOC=$alloc BENCH_LABEL="linux/$v/$alloc/gcc"
              echo "=== vdf_bench $BENCH_LABEL ===" | tee -a "$RESULTS"
              for _ in $(seq "$BENCH_RUNS"); do
                for run in "discr 50" "prove 300000"; do
                  # shellcheck disable=SC2086
                  "target-$v/release/vdf_bench" $run 2>&1 | tee -a "$RESULTS"
                  test "${PIPESTATUS[0]}" = 0
                done
              done
            done
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gmp-perf-linux
          path: results/linux.txt
          if-no-files-found: warn

  summary:
    name: Combined report
    needs: [windows, linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: gmp-perf-*
          merge-multiple: true
          path: results

      - name: Summarize
        run: |
          shopt -s nullglob
          files=(results/*.txt)
          [ "${#files[@]}" -gt 0 ] || { echo "no results"; exit 0; }
          python3 scripts/gmp-perf/summarize.py "${files[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/gmp-perf/summarize.py "${files[@]}" > results/summary.md

      - uses: actions/upload-artifact@v7
        with:
          name: gmp-perf-all
          path: results
